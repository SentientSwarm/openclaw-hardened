---
# Validate the optional host-metrics settings before anything is written.
- name: Check telemetry.prometheus.extra_scrape_configs
  assert:
    that:
      - _extra is sequence and _extra is not string and _extra is not mapping
      - _extra | rejectattr('job_name', 'defined') | list | length == 0
      - _extra | map(attribute='job_name') | list | unique | length == _extra | length
      - _extra | map(attribute='job_name') | select('in', ['node', 'prometheus', 'otel-collector-metrics', 'otel-collector-internal']) | list | length == 0
    fail_msg: "extra_scrape_configs must be a list of jobs, each with a unique job_name that does not reuse a built-in one"
  vars:
    _extra: "{{ telemetry.prometheus.extra_scrape_configs | default([]) }}"

- name: Check telemetry.prometheus.node_exporter.listen
  assert:
    that:
      - _listen is string
      - _listen is match('^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}:([1-9][0-9]{0,4})\Z')
      - (_listen.split(':')[1] | int) <= 65535
    fail_msg: "node_exporter.listen must be IPv4:port, for example 127.0.0.1:9101"
  vars:
    _listen: "{{ telemetry.prometheus.node_exporter.listen }}"
  when: telemetry.prometheus.node_exporter.listen is defined
