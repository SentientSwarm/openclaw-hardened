---
# Prometheus — scrapes OTel Collector metrics exporter and Phoenix

- name: Validate host-metrics settings
  include_tasks: host_metrics_checks.yml

- name: Create prometheus user
  user:
    name: prometheus
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /opt/prometheus
    - /var/lib/prometheus
    - /etc/prometheus

- name: Detect architecture
  set_fact:
    prom_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

- name: Download Prometheus
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ telemetry.prometheus.version }}/prometheus-{{ telemetry.prometheus.version }}.linux-{{ prom_arch }}.tar.gz"
    dest: /tmp/prometheus.tar.gz
    mode: "0644"
    timeout: 60
  environment:
    https_proxy: "http://{{ pipelock.listen }}"

- name: Extract Prometheus
  unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /opt/prometheus
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: /opt/prometheus/prometheus

- name: Write Prometheus config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Write systemd service
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify:
    - reload systemd
    - restart prometheus

- name: Enable and start prometheus
  systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

# Optional host metrics: the distro node exporter. Its defaults file is written
# before the package so it never starts on :9100, which llamafirewall may hold.
- name: Configure node exporter listen address
  copy:
    content: |
      ARGS="--web.listen-address={{ telemetry.prometheus.node_exporter.listen }} --collector.systemd --collector.pressure"
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
  when: telemetry.prometheus.node_exporter.listen is defined
  notify: restart node exporter

- name: Configure apt proxy for node exporter install
  copy:
    content: |
      Acquire::http::Proxy "http://{{ pipelock.listen }}";
      Acquire::https::Proxy "http://{{ pipelock.listen }}";
    dest: /etc/apt/apt.conf.d/90pipelock
    mode: "0644"
  when: telemetry.prometheus.node_exporter.listen is defined

- name: Install node exporter
  apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    dpkg_options: force-confold
  when: telemetry.prometheus.node_exporter.listen is defined

- name: Remove apt proxy config
  file:
    path: /etc/apt/apt.conf.d/90pipelock
    state: absent
  when: telemetry.prometheus.node_exporter.listen is defined

- name: Enable and start node exporter
  systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: telemetry.prometheus.node_exporter.listen is defined
