---
# network.docker_cidr and network.inference_ports have defaults here.
# network.gateway_ip, allowed_lan_ips, mgmt_cidrs are REQUIRED in site config.
network_defaults:
  docker_cidr: "172.16.0.0/12"
  inference_ports:
    - 443
    - 11434
    - 8091


# Incus agents guard and Locksmith forwarder. Off unless the site enables it;
# when enabled, the site config supplies every address (see
# docs/site-config-schema.md#agents_guard). Shallow merge: set the whole dict.
agents_guard:
  enabled: false
