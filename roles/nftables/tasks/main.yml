---
- name: Ensure llamafirewall user exists (needed for nftables skuid rule)
  user:
    name: llamafirewall
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: llamafirewall.enabled | default(false)

- name: Disable UFW
  systemd:
    name: ufw
    enabled: false
    state: stopped
  failed_when: false

- name: Check agents guard site config
  when: agents_guard.enabled | default(false)
  assert:
    that:
      - agents_guard.bridge is defined
      - agents_guard.bridge_cidr is defined
      - agents_guard.pipelock_address is defined
      - agents_guard.locksmith_forward.listen_address is defined
      - agents_guard.locksmith_forward.port is defined
      - agents_guard.locksmith_forward.upstream_ip is defined
      - agents_guard.locksmith_forward.upstream_port is defined
      - agents_guard.locksmith_forward.upstream_interface is defined
      - agents_guard.locksmith_forward.listen_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - agents_guard.locksmith_forward.upstream_ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - agents_guard.pipelock_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: "agents_guard.enabled needs the full agents_guard dict in site config (docs/site-config-schema.md#agents_guard)"

- name: Check agents guard cross-zone flows
  when: agents_guard.enabled | default(false)
  loop: "{{ agents_guard.cross_zone_flows | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  assert:
    that:
      # \Z, not $: Python's $ also matches before a trailing newline, which
      # would split one narrow accept into a broad one when rendered.
      - item.name is defined and item.name is string and item.name is match('^[a-z0-9-]{1,48}\\Z')
      - item.from_interface is defined and item.from_interface is string and item.from_interface is match('^[A-Za-z0-9_.-]{1,15}\\Z')
      - item.to_interface is defined and item.to_interface is string and item.to_interface is match('^[A-Za-z0-9_.-]{1,15}\\Z')
      - item.from_interface != item.to_interface
      - (item.from_interface == agents_guard.bridge and item.to_interface in agents_guard.cross_zone_peer_bridges | default([]))
        or (item.to_interface == agents_guard.bridge and item.from_interface in agents_guard.cross_zone_peer_bridges | default([]))
      - item.from_address is defined and item.from_address is string and item.from_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}\\Z')
      - item.to_address is defined and item.to_address is string and item.to_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}\\Z')
      - item.port is defined and item.port | string is match('^[0-9]{1,5}\\Z') and item.port | int > 0 and item.port | int < 65536
    fail_msg: "each agents_guard.cross_zone_flows entry needs name, from/to interface, single from/to addresses and one port, between the agents bridge and a bridge listed in agents_guard.cross_zone_peer_bridges (docs/site-config-schema.md#agents_guard)"

- name: Check agents guard cross-zone flow names are unique
  when: agents_guard.enabled | default(false)
  assert:
    that:
      - (agents_guard.cross_zone_flows | default([]) | map(attribute='name') | unique | list | length) == (agents_guard.cross_zone_flows | default([]) | length)
    fail_msg: "agents_guard.cross_zone_flows names must be unique; the rule comments identify each flow"

- name: Write nftables config
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    backup: true

- name: Enable nftables service
  systemd:
    name: nftables
    enabled: true

- name: Incus agents guard and Locksmith forwarder
  when: agents_guard.enabled | default(false)
  block:
    - name: Install Incus agents nftables guard rules
      template:
        src: agents-guard.nft.j2
        dest: /etc/agents-guard.nft
        mode: "0644"
        validate: nft -c -f %s
      notify: restart agents network guard

    - name: Install Incus agents network guard script and unit
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: agents-network-guard.sh.j2, dest: /usr/local/sbin/agents-network-guard, mode: "0755" }
        - { src: agents-network-guard.service.j2, dest: /etc/systemd/system/agents-network-guard.service, mode: "0644" }
      notify: restart agents network guard

    - name: Enable Incus agents network guard
      systemd:
        name: agents-network-guard.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Install Incus agents Locksmith forwarder units
      template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - agents-locksmith-forward.socket
        - agents-locksmith-forward.service
      notify: restart agents locksmith forwarder

    - name: Enable Incus agents Locksmith forwarder
      systemd:
        name: agents-locksmith-forward.socket
        enabled: true
        state: started
        daemon_reload: true

- name: Load nftables ruleset
  command: nft -f /etc/nftables.conf
  changed_when: true

# ── Slack IP refresh (WebSocket bypasses Pipelock proxy) ────
- name: Install Slack IP refresh script
  template:
    src: refresh-slack-ips.sh.j2
    dest: /usr/local/bin/refresh-slack-ips.sh
    mode: "0755"

- name: Install Slack IP refresh service
  template:
    src: refresh-slack-ips.service.j2
    dest: /etc/systemd/system/refresh-slack-ips.service
    mode: "0644"

- name: Install Slack IP refresh timer
  template:
    src: refresh-slack-ips.timer.j2
    dest: /etc/systemd/system/refresh-slack-ips.timer
    mode: "0644"

- name: Enable Slack IP refresh timer
  systemd:
    name: refresh-slack-ips.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Seed Slack IPs on first run
  command: /usr/local/bin/refresh-slack-ips.sh
  changed_when: true

# ── Discord IP refresh (WebSocket bypasses Pipelock proxy) ────
- name: Install Discord IP refresh script
  template:
    src: refresh-discord-ips.sh.j2
    dest: /usr/local/bin/refresh-discord-ips.sh
    mode: "0755"

- name: Install Discord IP refresh service
