    src: refresh-discord-ips.service.j2
    dest: /etc/systemd/system/refresh-discord-ips.service
    mode: "0644"

- name: Install Discord IP refresh timer
  template:
    src: refresh-discord-ips.timer.j2
    dest: /etc/systemd/system/refresh-discord-ips.timer
    mode: "0644"

- name: Enable Discord IP refresh timer
  systemd:
    name: refresh-discord-ips.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Seed Discord IPs on first run
  command: /usr/local/bin/refresh-discord-ips.sh
  changed_when: true
